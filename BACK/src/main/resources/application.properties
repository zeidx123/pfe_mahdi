# Application
spring.application.name=gestion-tournees
server.port=8080
# Private local secrets, loaded when starting from BACK (never packaged in the JAR).
spring.config.import=optional:file:./.env[.properties]

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/gestion_tournees
spring.data.mongodb.database=gestion_tournees
spring.data.mongodb.auto-index-creation=true

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-before-production}
app.jwt.expiration=604800000

# Explicit first-supervisor bootstrap. These mappings also make BACK/.env work
# consistently because imported .env entries are ordinary property keys.
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.bootstrap.email=${APP_BOOTSTRAP_EMAIL:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}

# Logging
logging.level.com.municipalite=DEBUG
logging.level.org.springframework.security=INFO

# File upload
spring.servlet.multipart.max-file-size=20MB
# Allow two validated 10 MiB vision images plus multipart metadata.
spring.servlet.multipart.max-request-size=22MB

# ============================================================
# CONFIGURATION IA — Agents Intelligents
# ============================================================

# Clé API Google Gemini (OBLIGATOIRE pour les agents Vision et Assistant)
# Obtenez votre clé sur : https://aistudio.google.com/app/apikey
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model-text=${GEMINI_MODEL_TEXT:gemini-3.8-flash}
ai.gemini.model-vision=${GEMINI_MODEL_VISION:gemini-3.8-flash}
ai.gemini.timeout-seconds=60

# Candidate requirements are edited/versioned through /api/ai/cv/requirements.
# Road routing uses routing.* below; image results have no invented confidence threshold.

# Dossiers de stockage des fichiers IA
ai.storage.cv-dir=${AI_STORAGE_CV_DIR:uploads/cv}
ai.storage.photos-dir=${AI_STORAGE_PHOTOS_DIR:uploads/photos}
ai.storage.documents-dir=${AI_STORAGE_DOCUMENTS_DIR:uploads/documents}

# Configuration RAG (Retrieval-Augmented Generation)
ai.rag.top-k=5
ai.rag.similarity-threshold=0.15
ai.rag.chunk-size=1000
ai.rag.chunk-overlap=150
ai.rag.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# Road routing. User-confirmed demo depot; environment variables override it.
routing.api-key=${ORS_API_KEY:}
routing.base-url=${ORS_BASE_URL:https://api.openrouteservice.org}
routing.profile=${ORS_PROFILE:driving-car}
routing.depot-latitude=${DEPOT_LATITUDE:36.722857}
routing.depot-longitude=${DEPOT_LONGITUDE:10.283535}
routing.depot-label=${DEPOT_LABEL:D\u00e9p\u00f4t}
routing.max-points=${ROUTING_MAX_POINTS:20}
routing.service-seconds=${STOP_SERVICE_SECONDS:300}
