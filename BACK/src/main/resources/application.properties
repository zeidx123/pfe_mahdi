# Application
spring.application.name=gestion-tournees
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/gestion_tournees
spring.data.mongodb.database=gestion_tournees
spring.data.mongodb.auto-index-creation=true

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-before-production}
app.jwt.expiration=604800000

# Logging
logging.level.com.municipalite=DEBUG
logging.level.org.springframework.security=INFO

# File upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ============================================================
# CONFIGURATION IA — Agents Intelligents
# ============================================================

# Clé API Google Gemini (OBLIGATOIRE pour les agents Vision et Assistant)
# Obtenez votre clé sur : https://aistudio.google.com/app/apikey
ai.gemini.api-key=VOTRE_CLE_GEMINI_ICI
ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.model-text=gemini-1.5-flash
ai.gemini.model-vision=gemini-1.5-flash
ai.gemini.timeout-seconds=60

# Agent CV — Configuration du profil recherché par défaut
ai.cv.min-experience-years=2
ai.cv.required-permis-types=B,C,CE
ai.cv.score-threshold-recommended=70
ai.cv.score-threshold-examiner=40

# Agent Optimisation Tournées
ai.route.depot-latitude=33.5731
ai.route.depot-longitude=-7.5898
ai.route.default-speed-kmh=40
ai.route.fuel-consumption-per-100km=20.0

# Agent Vision — Seuils de confiance
ai.vision.confidence-threshold-anomaly=0.65
ai.vision.auto-create-problem=true

# Dossiers de stockage des fichiers IA
ai.storage.cv-dir=uploads/cv
ai.storage.photos-dir=uploads/photos
ai.storage.documents-dir=uploads/documents

# Configuration RAG (Retrieval-Augmented Generation)
ai.rag.top-k=5
ai.rag.similarity-threshold=0.15
ai.rag.chunk-size=1000
ai.rag.chunk-overlap=150
ai.rag.embedding-model=text-embedding-004
