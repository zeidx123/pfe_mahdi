name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FRONT/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Backend tests (Windows)
        if: runner.os == 'Windows'
        working-directory: BACK
        run: ./mvnw.cmd -B test

      - name: Backend tests (Linux)
        if: runner.os == 'Linux'
        working-directory: BACK
        run: ./mvnw -B test

      - name: Supervisor web checks
        working-directory: FRONT
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Offline provider and evaluation checks
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          python -m unittest discover -s scripts/evaluation -p "test_*.py"
          python -m unittest discover -s evaluation/rag -p "test_*.py"
          python -m unittest discover -s evaluation/vision -p "test_*.py"
          python -m unittest discover -s evaluation/timing -p "test_*.py"

      - name: Driver application checks
        working-directory: MOBILE
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --no-web-resources-cdn
